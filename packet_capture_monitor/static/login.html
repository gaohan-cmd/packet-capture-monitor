<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · Packet Capture Monitor</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --bg: #f5f7fb;
        --panel: #ffffff;
        --text: #172033;
        --muted: #6b7280;
        --line: #dce3ee;
        --accent: #2563eb;
        --bad: #c2413b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          linear-gradient(180deg, rgba(37, 99, 235, 0.08), rgba(245, 247, 251, 0) 280px),
          var(--bg);
        color: var(--text);
      }

      main {
        width: min(420px, calc(100vw - 32px));
        padding: 30px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.1);
      }

      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.2;
      }

      p {
        margin: 8px 0 24px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      label {
        display: block;
        margin-top: 14px;
        color: #334155;
        font-size: 12px;
        font-weight: 720;
      }

      input {
        width: 100%;
        height: 42px;
        margin-top: 7px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: 0;
        font: inherit;
      }

      input:focus {
        border-color: #93c5fd;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
      }

      button {
        width: 100%;
        height: 42px;
        margin-top: 20px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #ffffff;
        font: inherit;
        font-weight: 760;
        cursor: pointer;
      }

      #error {
        min-height: 18px;
        margin-top: 12px;
        color: var(--bad);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Packet Capture Monitor</h1>
      <p>登录后查看抓包请求、响应数据和目标配置。</p>
      <form id="loginForm">
        <label for="username">用户名</label>
        <input id="username" name="username" autocomplete="username" value="admin" />
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" autofocus />
        <button type="submit">登录</button>
        <div id="error" aria-live="polite"></div>
      </form>
    </main>
    <script>
      const form = document.querySelector("#loginForm");
      const error = document.querySelector("#error");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.textContent = "";
        const payload = {
          username: form.username.value.trim(),
          password: form.password.value,
        };
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!response.ok) {
          error.textContent = "用户名或密码不正确";
          return;
        }
        location.href = "/";
      });
    </script>
  </body>
</html>
